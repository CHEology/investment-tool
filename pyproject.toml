[project]
name = "investment-tool"
version = "0.2.0"
description = "Auditable two-lane investment opportunity discovery and research system (A-shares + US)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CHEology" }]
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "keyring>=25.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
invest = "investment_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
