[project]
name = "investment-tool"
version = "1.0.0"
description = "Qlib-based, evidence-backed equity research assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "requests>=2.32,<3",
  "exchange-calendars>=4.5,<5", "curl-cffi>=0.13,<1",
]

[project.optional-dependencies]
quant = [
  "pyqlib @ git+https://github.com/microsoft/qlib.git@54355232463878d2eebb91fe0ee5fa7fa1f5976c",
  "lightgbm>=4.6,<5",
]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
invest = "investment_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_tool"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["quant: exercises the installed Qlib and LightGBM engines"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
